# RustFS S3-compatible storage backend override for Samay's self-hosted Supabase
# (RUSTFS migration, 2026-09-30).
#
# REPLACES the retired MinIO override (docker-compose.s3.yml, removed
# 2026-09-30): the MinIO OSS repo was archived 2026-04-25 and is source-only
# now, and the `minio/minio` / `minio/mc` images are no longer anonymously
# pullable (registry requires auth). RustFS is the maintained S3 backend that
# upstream supabase/supabase adopted (docker/docker-compose.rustfs.yml).
#
# What it configures (same storage-api v1.60.4 S3 contract the MinIO override
# used, verified against src/config.ts + src/storage/backend/s3/adapter.ts):
#   - rustfs:             S3 server; ports 9000 (S3 API) + 9001 (console) stay
#                         CONTAINER-INTERNAL — no host binding is approved
#                         (SELFHOSTING.md §1.2). Healthcheck uses the image's
#                         HTTP /health endpoint.
#   - rustfs-createbucket: one-shot bucket bootstrap (idempotent
#                         `rc mb --ignore-existing`), runs once rustfs is
#                         healthy; storage waits for its success.
#   - storage env:       STORAGE_BACKEND=s3 + the GLOBAL_S3_*/AWS_* vars the
#                         image ACTUALLY reads: GLOBAL_S3_ENDPOINT (or
#                         STORAGE_S3_ENDPOINT), GLOBAL_S3_FORCE_PATH_STYLE (or
#                         STORAGE_S3_FORCE_PATH_STYLE), REGION (from the base
#                         storage env), and the AWS SDK default credential chain
#                         (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).
#
# Credentials: placeholder dev values; compose interpolation with defaults, so
# the parse is standalone-clean and a .env can override (RUSTFS_ACCESS_KEY /
# RUSTFS_SECRET_KEY; RustFS requires >=8 chars for the secret).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.rustfs.yml up -d
#   (or add docker-compose.rustfs.yml to COMPOSE_FILE in .env — both Samay
#    stacks already do)

services:
  rustfs:
    container_name: ${STACK_PREFIX:-samay}-rustfs
    image: rustfs/rustfs:v1.0.0-rc.5
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://rustfs:9000/health"]
      interval: 2s
      timeout: 10s
      retries: 5
    volumes:
      - rustfs-data:/data

  rustfs-createbucket:
    container_name: ${STACK_PREFIX:-samay}-rustfs-createbucket
    image: rustfs/rc:v0.1.36
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      rc alias set supa-rustfs http://rustfs:9000 ${RUSTFS_ACCESS_KEY:-} ${RUSTFS_SECRET_KEY:-} &&
      rc mb --ignore-existing supa-rustfs/${GLOBAL_S3_BUCKET:-samay-storage}
      "

  storage:
    depends_on:
      rustfs:
        condition: service_healthy
      rustfs-createbucket:
        condition: service_completed_successfully
    environment:
      STORAGE_BACKEND: s3
      GLOBAL_S3_ENDPOINT: http://rustfs:9000
      GLOBAL_S3_PROTOCOL: http
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-}

volumes:
  rustfs-data:
