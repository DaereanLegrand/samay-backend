services:
  db:
    container_name: samay-db
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-54382}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: supabase
      POSTGRES_DB_NAME: supabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_CONFIG_FILE: /etc/postgresql/postgresql.conf
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data/pgdata
      - ./volumes/db/init:/docker-entrypoint-initdb.d

  kong:
    container_name: samay-kong
    image: kong/kong:3.9.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: kong health
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_LOG_LEVEL: warn
      KONG_NGINX_WORKER_PROCESSES: 2
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PROXY_LISTEN_SSL: 0.0.0.0:8443
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      # kong.yml keyauth_credentials resolve these $VAR refs (M-03): values
      # come from .env (SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY) with
      # safe .env.example placeholder defaults — no key material committed.
      ANON_KEY: ${SUPABASE_ANON_KEY:-your_supabase_anon_key_here}
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "${KONG_HTTP_PORT:-54386}:8000"
      - "${KONG_HTTPS_PORT:-54443}:8443"
    volumes:
      - ./volumes/api/kong.yml:/api/kong.yml:ro
      - ./volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/home/kong/kong-entrypoint.sh"]

  auth:
    container_name: samay-auth
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9999/health
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_ADDITIONAL_REDIRECT_URLS: ""
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_SECRET: "your-jwt-secret-change-in-production"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: true
      GOTRUE_EXTERNAL_PHONE_ENABLED: false
      GOTRUE_SMTP_ADMIN_EMAIL: samayverif@qallariy.lat
      GOTRUE_SMTP_HOST: smtp.purelymail.com
      GOTRUE_SMTP_PORT: 587
      GOTRUE_SMTP_USER: samayverif@qallariy.lat
      GOTRUE_SMTP_PASS: "your-smtp-password"
      GOTRUE_SMTP_SENDER_NAME: Samay
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: "/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_RECOVERY: "/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: "/auth/v1/verify"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Confirma tu correo — Samay"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Recupera tu contraseña — Samay"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "Confirma tu nuevo correo — Samay"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@samay-db:5432/postgres
      GOTRUE_DB_MAX_POOL_SIZE: 10
      GOTRUE_LOG_LEVEL: warn
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${AUTH_RATE_LIMIT_EMAIL_SENT:-2}
      GOTRUE_OPERATOR_TOKEN: ""
      GOTRUE_DISABLE_SIGNUP: false

  rest:
    container_name: samay-rest
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: postgrest --ready
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@samay-db:5432/postgres
      PGRST_DB_SCHEMA: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "your-jwt-secret-change-in-production"
      PGRST_DB_AGGREGATES_ENABLED: true
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_OPENAPI_SERVER_PROXY_URI: http://127.0.0.1:${KONG_HTTP_PORT:-54386}
      PGRST_OPENAPI_SECURITY_ACTIVE: true
      PGRST_DB_POOL: 10
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost

  realtime:
    container_name: samay-realtime
    image: supabase/realtime:v2.102.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl -fsS http://localhost:4000/healthcheck
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: samay-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: "supabase-realtime-encryption-key-change-in-production"
      API_JWT_SECRET: "your-jwt-secret-change-in-production"
      SECRET_KEY_BASE: "supabase-realtime-secret-key-base-change-in-production"
      METRICS_JWT_SECRET: "your-jwt-secret-change-in-production"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      ERL_AFLAGS: "-proto_dist inet_tcp"
      DNS_NODES: "''"

  storage:
    container_name: samay-storage
    image: supabase/storage-api:v1.60.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5000/status
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: "your-anon-key"
      SERVICE_KEY: "your-service-role-key"
      TENANT_ID: samay
      REGION: us-east-1
      GLOBAL_S3_BUCKET: samay-storage
      DATABASE_URL: postgres://postgres:postgres@samay-db:5432/postgres
      PGRST_JWT_SECRET: "your-jwt-secret-change-in-production"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_AUTO_CREATE: true
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      LOG_LEVEL: warn
    volumes:
      - ./volumes/storage:/var/lib/storage

  imgproxy:
    container_name: samay-imgproxy
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    volumes:
      - ./volumes/storage:/var/lib/storage
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP:-true}
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8

  meta:
    container_name: samay-meta
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)throw new Error(r.status)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PG_META_DB_HOST: samay-db
      PG_META_DB_PORT: 5432
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgres
      PG_META_DB_NAME: postgres

  studio:
    container_name: samay-studio
    image: supabase/studio:2026.08.03-sha-022b374
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meta:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)}).catch(()=>process.exit(1))"
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://samay-meta:8080
      SUPABASE_URL: http://127.0.0.1:${KONG_HTTP_PORT:-54386}
      SUPABASE_ANON_KEY: "your-anon-key"
      SUPABASE_SERVICE_KEY: "your-service-role-key"
      SUPABASE_PUBLIC_URL: http://127.0.0.1:${KONG_HTTP_PORT:-54386}
    ports:
      - "${STUDIO_PORT:-54381}:3000"

  functions:
    container_name: samay-functions
    image: supabase/edge-runtime:v1.74.0
    restart: unless-stopped
    volumes:
      - ./functions:/home/deno/functions
      - deno-cache:/root/.cache/deno
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      # Edge Functions env contract (M-07, official supabase compose for
      # edge-runtime v1.74.0): the SUPABASE_* vars are passed through to the
      # Deno runtime for future function code (EEDG) — none are required at
      # boot (verified in edge-runtime source). The runtime DOES require a
      # main service entrypoint (`functions/main/index.ts` boot placeholder,
      # see supabase/functions/README.md) or the container crash-loops.
      JWT_SECRET: "your-jwt-secret-change-in-production"
      SUPABASE_URL: http://samay-kong:8000
      SUPABASE_PUBLIC_URL: http://127.0.0.1:${KONG_HTTP_PORT:-54386}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-your_supabase_anon_key_here}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_PUBLISHABLE_KEYS: "{\"default\":\"${SUPABASE_PUBLISHABLE_KEY:-}\"}"
      SUPABASE_SECRET_KEYS: "{\"default\":\"${SUPABASE_SECRET_KEY:-}\"}"
      SUPABASE_DB_URL: postgresql://postgres:postgres@samay-db:5432/postgres
      VERIFY_JWT: "${FUNCTIONS_VERIFY_JWT:-false}"
    command: ["start", "--main-service", "/home/deno/functions/main"]

volumes:
  db-config:
  deno-cache:
