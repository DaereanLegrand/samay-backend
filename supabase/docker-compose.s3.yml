# S3-compatible storage backend override for Samay's self-hosted Supabase
# (MinIO) — DKR-08, agent M-06.
#
# Mirror of the official supabase/supabase docker/docker-compose.s3.yml
# pattern, with images PINNED per SELFHOSTING.md §2.2 (the official file uses
# floating cgr.dev/chainguard tags — unpinned, rejected by Samay's pin
# policy). Tag set verified on Docker Hub 2026-08-10: minio server
# RELEASE.2025-09-07T16-13-09Z, mc client RELEASE.2025-08-13T08-35-41Z.
#
# What it configures (env contract verified against supabase/storage-api
# v1.60.4 src/config.ts + src/storage/backend/s3/adapter.ts, 2026-08-10):
#   - minio:             S3 server; ports 9000 (S3 API) + 9001 (console) stay
#                        CONTAINER-INTERNAL — no host binding is approved for
#                        minio (SELFHOSTING.md §1.2). Healthcheck uses mc's
#                        built-in `local` alias (mc config-v10.go loadDefaults:
#                        local -> http://localhost:9000).
#   - minio-createbucket: one-shot bucket bootstrap (idempotent
#                        `mc mb --ignore-existing`), runs once minio is
#                        healthy; storage waits for its success.
#   - storage env:       STORAGE_BACKEND=s3 + the GLOBAL_S3_*/AWS_* vars the
#                        image ACTUALLY reads: GLOBAL_S3_ENDPOINT (or
#                        STORAGE_S3_ENDPOINT), GLOBAL_S3_FORCE_PATH_STYLE (or
#                        STORAGE_S3_FORCE_PATH_STYLE), REGION (already set in
#                        the base storage env; the image reads REGION or
#                        STORAGE_S3_REGION), and the AWS SDK default
#                        credential chain (AWS_ACCESS_KEY_ID /
#                        AWS_SECRET_ACCESS_KEY). The pre-M-06 stub's
#                        AWS_ENDPOINT / AWS_DEFAULT_REGION are NOT read by the
#                        image (dead vars — removed). GLOBAL_S3_PROTOCOL is
#                        kept for official parity (inert in v1.60.4).
#
# Credentials: placeholder dev values (the official .env.example defaults
# supa-storage / secret1234 — SELFHOSTING.md §2.5; minio requires >=8 chars
# for the root password). Compose interpolation with defaults, so the parse
# is standalone-clean and a future .env can override (M-13/S-08 scope).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d
#   (or add docker-compose.s3.yml to COMPOSE_FILE in .env — both Samay
#    stacks already do)

services:
  minio:
    container_name: samay-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-supa-storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-secret1234}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 5
    volumes:
      - minio-data:/data

  minio-createbucket:
    container_name: samay-minio-createbucket
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      mc alias set supa-minio http://minio:9000 ${MINIO_ROOT_USER:-supa-storage} ${MINIO_ROOT_PASSWORD:-secret1234} &&
      mc mb --ignore-existing supa-minio/${GLOBAL_S3_BUCKET:-samay-storage}
      "

  storage:
    depends_on:
      minio:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    environment:
      STORAGE_BACKEND: s3
      GLOBAL_S3_ENDPOINT: http://minio:9000
      GLOBAL_S3_PROTOCOL: http
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-supa-storage}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-secret1234}

volumes:
  minio-data:
