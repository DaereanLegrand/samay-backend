# Samay — Supabase CLI Configuration
# Ports remapped per AGENTS.md Port Convention

project_id = "samay"

[api]
enabled = true
port = 54386

[api.tls]
enabled = false

[db]
port = 54382
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54381
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54384

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000", "samay://reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Slim build: the app boots as a guest. Anonymous sessions are real GoTrue
# users (role=authenticated) so every existing grant/RLS contract still
# applies; onboarding (18+ + terms) is recorded by bootstrap_profile.
enable_anonymous_sign_ins = true
# Anonymous → Apple/Google conversion. Manual linking keeps the SAME user id,
# so guest progress survives the upgrade (no data migration).
enable_manual_linking = true
minimum_password_length = 8

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Google OAuth provider (native Android/iOS + web). Client IDs are
# comma-joined with the WEB client id FIRST (Supabase requirement); the
# secret is the web client secret. iOS native sign-in requires
# skip_nonce_check = true. Disabled locally; prod supplies real values via the
# vault `server` profile + <deploy-override> (GOTRUE_EXTERNAL_GOOGLE_*).
[auth.external.google]
enabled = false
client_id = ""
secret = ""
skip_nonce_check = true

# Apple OAuth provider (native Sign in with Apple). For the native-only flow the
# client_id is the App ID / bundle id and no secret is required: GoTrue's
# id_token grant checks the token audience against the client-id list and never
# constructs the Apple provider. The secret (generated ES256 client-secret JWT,
# Services ID) is only needed for the web /authorize redirect flow and comes
# from the vault `server` profile in prod. Config.toml is not read by the
# `docker compose` testing stack; this mirrors backend/supabase/.env.
[auth.external.apple]
enabled = true
client_id = "com.qallariy.samay"
secret = ""

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sessions]

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = true
port = 54388
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = ""
s3_region = ""
s3_access_key = ""
s3_secret_key = ""
